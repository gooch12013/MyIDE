<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
<title>MyIDE</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <span class="brand"><b>M</b>yIDE</span>
  <nav class="topnav" id="project-keys" aria-label="Projects"></nav>
</header>
<p id="claude-banner" class="banner" role="status" hidden></p>
<main id="dock"></main>
<section id="empty-state" class="empty-state" hidden>
  <p class="legend" id="empty-title">No projects yet</p>
  <p id="empty-text">A project is a folder you work in. Its terminals open there and it keeps its own layout.</p>
  <nav class="empty-closed" id="empty-closed" aria-label="Closed projects" hidden></nav>
  <button type="button" class="key key--go" id="empty-add">Add a project</button>
</section>
<dialog id="layout-name" class="sheet" aria-labelledby="layout-name-title">
  <form method="dialog">
    <label class="legend" id="layout-name-title" for="layout-name-input">Save layout as</label>
    <input id="layout-name-input" class="input" required maxlength="60" autocomplete="off" placeholder="e.g. Laptop only">
    <div class="sheet-keys">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn btn--primary" value="save">Save</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
